            text-decoration: underline;
        }

        .apps {
            width: 22px;
            height: 22px;
            display: grid;
            grid-template-columns: repeat(3, 5px);
            grid-template-rows: repeat(3, 5px);
            gap: 3px;
            cursor: pointer;
        }

        .apps span {
            background: #5f6368;
            border-radius: 50%;
        }

        .sign-in {
            background: #1a73e8;
            color: white !important;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none !important;
        }

        /* Main Google Area */
        .main {
            min-height: calc(100vh - 130px);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 150px;
        }

        .logo {
            font-size: 88px;
            font-weight: 500;
            letter-spacing: -7px;
            margin-bottom: 35px;
            user-select: none;
        }

        .blue {
            color: #4285f4;
        }

        .red {
            color: #ea4335;
        }

        .yellow {
            color: #fbbc05;
        }

        .search-input {
            border: none;

            font-size: 20px;

        .buttons {

        }

            border-radius: 4px;
            font-size: 14px;

        .google-button:hover {

        }

        /* Language */
        .languages {
            margin-top: 28px;
            font-size: 13px;
        }

        .languages a {
            color: #1a0dab;
            text-decoration: none;
            margin: 0 5px;
        }

        .languages a:hover {
            text-decoration: underline;
        }

        /* Footer */
        footer {

            font-size: 14px;
        }

        .country {
            padding: 15px 30px;

        }

        .footer-links {

        }

        .footer-left,

            color: #70757a;

            }

            .logo {
                font-size: 65px;
            }

            .footer-links {
                flex-direction: column;
                gap: 15px;
                align-items: center;
            }

            .footer-left,
            .footer-right {
                flex-wrap: wrap;
                justify-content: center;
            }
        }
    </style>
</head>
